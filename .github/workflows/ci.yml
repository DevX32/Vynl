name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · typecheck + build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

  site:
    name: Site · build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build
        working-directory: site
        env:
          GITHUB_TOKEN: ''
          VYNL_OFFLINE_BUILD: '1'
        run: bun install --frozen-lockfile && bun run build

  mobile:
    name: Mobile · analyze
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test

  mobile-compose:
    name: Mobile · compose build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install the android sdk parts
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile-android/rust -> target
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: rustfmt (the phone catalogue)
        run: cargo fmt --manifest-path mobile-android/rust/Cargo.toml -- --check
      - name: Build the phone app
        working-directory: mobile-android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: ./gradlew :app:assembleDebug --no-daemon

  rust:
    name: Rust · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config curl wget file \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev
      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: rustfmt (shared catalogue)
        run: cargo fmt --manifest-path crates/vynl-catalogue/Cargo.toml -- --check
      - name: rustfmt (phone bridge)
        run: cargo fmt --manifest-path crates/vynl-catalogue-ffi/Cargo.toml -- --check
      - run: cargo check
        working-directory: src-tauri
      - name: cargo check (shared catalogue, without the javascript runtime)
        working-directory: crates/vynl-catalogue
        run: cargo check --no-default-features
      - name: cargo check (phone bridge)
        working-directory: crates/vynl-catalogue-ffi
        run: cargo check
