name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · typecheck + build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

  site:
    name: Site · build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build
        working-directory: site
        env:
          GITHUB_TOKEN: ''
          VYNL_OFFLINE_BUILD: '1'
        run: bun install --frozen-lockfile && bun run build

  mobile:
    name: Mobile · analyze
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Analyze
        working-directory: mobile
        run: flutter analyze
      - name: Test
        working-directory: mobile
        run: flutter test

  rust:
    name: Rust · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config curl wget file \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev
      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: rustfmt (shared catalogue)
        run: cargo fmt --manifest-path crates/vynl-catalogue/Cargo.toml -- --check
      - name: rustfmt (phone bridge)
        run: cargo fmt --manifest-path crates/vynl-catalogue-ffi/Cargo.toml -- --check
      - run: cargo check
        working-directory: src-tauri
      - name: cargo check (shared catalogue, without the javascript runtime)
        working-directory: crates/vynl-catalogue
        run: cargo check --no-default-features
      - name: cargo check (phone bridge)
        working-directory: crates/vynl-catalogue-ffi
        run: cargo check
