name: vynl_mobile
description: Vynl offline music player for Android
publish_to: "none"
version: 0.2.5+2007
license: GPL-3.0-only

environment:
  sdk: ">=3.5.0 <4.0.0"

dependency_overrides:
  path_provider_android: 2.2.23
  audio_service:
    path: third_party/audio_service
  just_audio_background:
    path: third_party/just_audio_background

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  provider: ^6.1.2
  intl: ^0.19.0
  mobile_scanner: ^6.0.2
  flutter_local_notifications: ^18.0.1
  collection: ^1.18.0
  palette_generator: ^0.3.3
  just_audio_background: ^0.0.1-beta.17
  package_info_plus: ^9.0.1
  open_filex: ^4.7.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Variable.ttf
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Variable.ttf
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
        - asset: assets/fonts/Fraunces-Italic-Variable.ttf
          style: italic
