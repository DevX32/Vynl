[package]
name = "vynl-catalogue-app"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "The catalogue the phone app talks to, in rust"

[lib]
name = "vynl_catalogue"
crate-type = ["cdylib"]

[dependencies]

ytmusic = { git = "https://github.com/DevX32/vynl-ytmusic", branch = "main", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "cookies"] }
urlencoding = "2"
