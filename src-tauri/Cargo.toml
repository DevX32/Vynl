[package]
name = "vynl"
version = "0.2.7"
description = "Music Player"
authors = ["Vynl"]
edition = "2024"
license = "GPL-3.0-only"

[lib]
name = "vynl_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "cookies", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time", "fs"] }
zip = "2"
dirs = "6"
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
hmac = "0.12"
once_cell = "1"
libc = "0.2"
urlencoding = "2"
discord-rich-presence = "1.1"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
ctrlc = "3"
rodio = "0.19"
uuid = { version = "1", features = ["v4"] }
lofty = "0.25"
axum = { version = "0.8", features = ["multipart"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
qrcode = "0.14"
mdns-sd = "0.21"
symphonia = { version = "0.6", features = ["isomp4", "aac", "mp3"] }
mp3lame-encoder = "0.2"
symphonia-adapter-libopus = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"

[profile.release]
lto = true
codegen-units = 1
strip = true
