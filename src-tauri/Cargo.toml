[package]
name = "vynl"
version = "0.8.5"
description = "Music Player"
authors = ["Vynl"]
edition = "2024"
license = "GPL-3.0-only"

[lib]
name = "vynl_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "cookies", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time", "fs"] }
zip = "2"
dirs = "6"
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
hmac = "0.12"
once_cell = "1"
libc = "0.2"
urlencoding = "2"
discord-rich-presence = "1.1"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
ctrlc = "3"
rodio = { version = "0.19", default-features = false }
uuid = { version = "1", features = ["v4"] }
lofty = "0.25"
axum = { version = "0.8", features = ["multipart"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
qrcode = "0.14"
mdns-sd = "0.21"
symphonia = { version = "0.6", features = ["isomp4", "aac", "mp3", "mkv"] }
mp3lame-encoder = "0.2"
symphonia-adapter-libopus = "0.3"
ytmusic = { git = "https://github.com/DevX32/vynl-ytmusic", branch = "main" }
rcgen = "0.14.10"
axum-server = { version = "0.9.2", features = ["tls-rustls"] }
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
souvlaki = { version = "0.8.3", default-features = false }
window-vibrancy = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }

[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = { version = "0.8.3", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
